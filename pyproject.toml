[build-system]
requires = ["setuptools>=68,<83", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "economic-data-exporter"
version = "0.6.1"
description = "Secure desktop exporter for authoritative economic time-series data"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Economic Data Exporter contributors"}]
dependencies = [
  "PySide6>=6.8,<7",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "platformdirs>=4.3,<5",
  "keyring>=25.5,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-mock>=3.14,<4",
  "respx>=0.22,<0.23",
  "ruff>=0.9,<1",
  "black>=24.10,<27",
  "mypy>=1.14,<2",
  "coverage[toml]>=7.6,<8",
  "memory-profiler>=0.61,<0.62",
]
analysis = [
  "quantecon>=0.8,<1",
]

[project.scripts]
economic-data-exporter = "economic_data_exporter.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
